name: Live check

# 배포된 서버에 실제로 접속해 친구와 대결·관전 흐름을 확인한다 (수동 실행).
on:
  workflow_dispatch:
    inputs:
      base:
        description: '확인할 서버 주소 (비우면 기본 주소)'
        required: false
        default: ''

permissions:
  contents: read

jobs:
  versus:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: Spectator flow
        env:
          BASE: ${{ inputs.base || vars.API_BASE_URL || 'https://api.ohsangplay.com/4s' }}
        run: |
          node tools/e2e/spectator-e2e.mjs | tee out.txt
          status=${PIPESTATUS[0]}
          grep FAIL out.txt | while read -r line; do echo "::error::$line"; done
          echo "::notice::$(tail -1 out.txt)"
          exit $status
