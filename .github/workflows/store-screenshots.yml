name: Store screenshots

# 스토어 스크린샷을 실제 앱 화면으로 만든다 (Actions에서 직접 실행).
# 만든 이미지는 Artifacts(store-screenshots)로 올라간다. 문구 얹기는 docs/STORE.md 참고.
# update_store를 켜면 문구를 얹어 store/screenshots를 갱신하고, 실행한 브랜치에 커밋한다.
on:
  workflow_dispatch:
    inputs:
      update_store:
        description: 'store/screenshots를 갱신해 이 브랜치에 커밋'
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  screenshots:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - run: flutter pub get
      - name: Render screenshots
        run: |
          set +e
          bash tool/store_screenshots.sh --file-reporter=json:report.json
          status=$?
          if [ $status -ne 0 ]; then
            jq -rs '
              (map(select(.type == "testStart")) | map({key: (.test.id | tostring), value: .test.name}) | from_entries) as $names
              | (map(select(.type == "error") | .testID) | unique) as $failed
              | . as $all
              | $failed[]
              | . as $id
              | ([$all[] | select(.testID == $id and (.type == "print" or .type == "error")) | (.message // .error // "")] | join("\n")) as $text
              | "::error title=\($names[($id | tostring)] // "test")::\($text[0:3500] | gsub("%"; "%25") | gsub("\r"; "") | gsub("\n"; "%0A"))"
            ' report.json
          fi
          exit $status

      - uses: actions/upload-artifact@v4
        with:
          name: store-screenshots
          path: store_screenshots/out

      - name: Update store/screenshots
        if: ${{ inputs.update_store }}
        run: |
          sudo apt-get update -q && sudo apt-get install -yq fonts-noto-cjk python3-pil
          python3 tools/make_store_screenshots.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add store/screenshots
          if git diff --cached --quiet; then
            echo "바뀐 스크린샷 없음"
          else
            git commit -m "스토어 스크린샷 갱신"
            git push
          fi
