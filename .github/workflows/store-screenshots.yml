name: Store screenshots

# 스토어 스크린샷을 실제 앱 화면으로 만든다.
# Actions에서 직접 실행하거나 store-screenshots/** 브랜치에 push하면 실행되고,
# 만든 이미지를 Artifacts(store-screenshots)로 올린다. push로 실행했으면 그 브랜치에도 커밋한다.
on:
  workflow_dispatch:
  push:
    branches: ['store-screenshots/**']

permissions:
  contents: write

jobs:
  screenshots:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - run: flutter pub get
      - name: Render screenshots
        run: |
          set +e
          bash tool/store_screenshots.sh --file-reporter=json:report.json
          status=$?
          if [ $status -ne 0 ]; then
            jq -rs '
              (map(select(.type == "testStart")) | map({key: (.test.id | tostring), value: .test.name}) | from_entries) as $names
              | (map(select(.type == "error") | .testID) | unique) as $failed
              | . as $all
              | $failed[]
              | . as $id
              | ([$all[] | select(.testID == $id and (.type == "print" or .type == "error")) | (.message // .error // "")] | join("\n")) as $text
              | "::error title=\($names[($id | tostring)] // "test")::\($text[0:3500] | gsub("%"; "%25") | gsub("\r"; "") | gsub("\n"; "%0A"))"
            ' report.json
          fi
          exit $status

      - uses: actions/upload-artifact@v4
        with:
          name: store-screenshots
          path: store_screenshots/out

      - name: Commit screenshots to the branch
        if: github.event_name == 'push'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f store_screenshots/out
          if git diff --cached --quiet; then
            echo "변경 없음"
          else
            git commit -m "스토어 스크린샷 갱신 [skip ci]"
            git push
          fi
