name: CI & Deploy

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  worker:
    name: Worker typecheck & test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: worker
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: worker/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm test

  # main에서만 실행. Cloudflare 시크릿 두 개(CLOUDFLARE_API_TOKEN, CLOUDFLARE_ACCOUNT_ID)만 있으면
  # D1 데이터베이스 생성 → 마이그레이션 → Worker 배포 → 주소 전달까지 자동으로 한다.
  deploy-worker:
    name: Deploy ranking server (Cloudflare)
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: worker
    runs-on: ubuntu-latest
    outputs:
      url: ${{ steps.deploy.outputs.url }}
    defaults:
      run:
        working-directory: worker
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      DB_NAME: four-s-challenge
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: worker/package-lock.json

      - name: Check Cloudflare settings
        id: cf
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "::notice::Cloudflare 시크릿(CLOUDFLARE_API_TOKEN, CLOUDFLARE_ACCOUNT_ID)이 없어 랭킹 서버 배포를 건너뜁니다. 웹은 오프라인 모드로 배포됩니다."
            echo "ready=false" >> "$GITHUB_OUTPUT"
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi

      - if: steps.cf.outputs.ready == 'true'
        run: npm ci

      - name: Find or create D1 database
        if: steps.cf.outputs.ready == 'true'
        run: |
          find_id() {
            npx wrangler d1 list --json | jq -r --arg n "$DB_NAME" '.[] | select(.name == $n) | .uuid' | head -n1
          }
          id="$(find_id)"
          if [ -z "$id" ]; then
            echo "D1 데이터베이스 '$DB_NAME'이 없어 새로 만듭니다."
            npx wrangler d1 create "$DB_NAME" --location apac
            id="$(find_id)"
          fi
          if [ -z "$id" ]; then
            echo "::error::D1 데이터베이스를 찾거나 만들지 못했습니다. API 토큰에 D1 Edit 권한이 있는지 확인하세요."
            exit 1
          fi
          echo "D1 database id: $id"
          sed -i "s/00000000-0000-0000-0000-000000000000/$id/" wrangler.toml

      - name: Apply D1 migrations
        if: steps.cf.outputs.ready == 'true'
        run: npx wrangler d1 migrations apply DB --remote

      - name: Deploy worker
        id: deploy
        if: steps.cf.outputs.ready == 'true'
        run: |
          npx wrangler deploy 2>&1 | tee deploy.log
          url="$(grep -oE 'https://[a-zA-Z0-9.-]+\.workers\.dev' deploy.log | head -n1)"
          if [ -z "$url" ]; then
            echo "::warning::배포된 Worker 주소를 찾지 못했습니다. 저장소 변수 API_BASE_URL에 주소를 직접 넣어 주세요."
          else
            echo "Worker URL: $url"
            echo "url=$url" >> "$GITHUB_OUTPUT"
          fi

      - name: Health check
        if: steps.deploy.outputs.url != ''
        env:
          URL: ${{ steps.deploy.outputs.url }}
        run: |
          for i in $(seq 1 10); do
            if curl -fsS "$URL/api/health"; then echo; exit 0; fi
            sleep 3
          done
          echo "::error::랭킹 서버가 응답하지 않습니다: $URL/api/health"
          exit 1

  build:
    name: Analyze, test, build web
    needs: deploy-worker
    # PR에서는 deploy-worker가 건너뛰어져도 실행한다.
    if: ${{ !cancelled() && (needs.deploy-worker.result == 'success' || needs.deploy-worker.result == 'skipped') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - run: flutter --version
      - run: flutter pub get

      - name: Analyze
        run: |
          set +e
          dart analyze --format=machine --fatal-infos > analyze.txt 2>&1
          status=$?
          cat analyze.txt
          # 분석 결과를 PR 주석으로 남긴다.
          while IFS='|' read -r severity type code file line col length message; do
            [ -z "$message" ] && continue
            echo "::error file=${file#"$GITHUB_WORKSPACE"/},line=$line,col=$col::[$code] $message"
          done < analyze.txt
          exit $status

      - name: Test
        run: |
          set +e
          flutter test --reporter=github --file-reporter=json:test-report.json
          status=$?
          if [ $status -ne 0 ]; then
            # 실패한 테스트 이름과 오류를 PR 주석으로 남긴다.
            jq -rs '
              (map(select(.type == "testStart")) | map({key: (.test.id | tostring), value: .test.name}) | from_entries) as $names
              | (map(select(.type == "error") | .testID) | unique) as $failed
              | . as $all
              | $failed[]
              | . as $id
              | ([$all[] | select(.testID == $id and (.type == "print" or .type == "error")) | (.message // .error // "")] | join("\n")) as $text
              | "::error title=\($names[($id | tostring)] // "test")::\($text[0:3500] | gsub("%"; "%25") | gsub("\r"; "") | gsub("\n"; "%0A"))"
            ' test-report.json
          fi
          exit $status

      # 랭킹 서버 주소: 저장소 변수 API_BASE_URL이 있으면 그 값, 없으면 방금 배포한 Worker 주소.
      # 둘 다 없으면 오프라인 모드로 빌드한다.
      - name: Build web
        env:
          API_BASE_URL: ${{ vars.API_BASE_URL || needs.deploy-worker.outputs.url }}
        run: |
          if [ -n "$API_BASE_URL" ]; then
            echo "랭킹 서버: $API_BASE_URL"
          else
            echo "랭킹 서버 주소가 없어 오프라인 모드로 빌드합니다."
          fi
          flutter build web --release --base-href / --dart-define=API_BASE_URL="$API_BASE_URL"

      # 초대 링크(?room=CODE)를 앱으로 여는 데 필요한 검증 파일. 저장소 변수가 있을 때만 만든다.
      # - ANDROID_CERT_SHA256: 앱 서명 인증서 SHA-256 (여러 개면 쉼표로 구분. Play 앱 서명 키 + 업로드 키)
      # - APPLE_TEAM_ID: Apple 개발자 팀 ID (10글자)
      # upload-pages-artifact v4부터는 숨김 폴더(.well-known)가 기본으로 빠지니 올릴 때 include-hidden-files를 켤 것.
      - name: App link verification files
        env:
          APP_ID: com.ohsang.fourschallenge
          ANDROID_CERT_SHA256: ${{ vars.ANDROID_CERT_SHA256 }}
          APPLE_TEAM_ID: ${{ vars.APPLE_TEAM_ID }}
        run: |
          mkdir -p build/web/.well-known
          if [ -n "$ANDROID_CERT_SHA256" ]; then
            jq -n --arg pkg "$APP_ID" --arg certs "$ANDROID_CERT_SHA256" '[{
              relation: ["delegate_permission/common.handle_all_urls"],
              target: {
                namespace: "android_app",
                package_name: $pkg,
                sha256_cert_fingerprints: ($certs | split(",") | map(gsub("[[:space:]]"; "") | ascii_upcase) | map(select(length > 0)))
              }
            }]' > build/web/.well-known/assetlinks.json
            cat build/web/.well-known/assetlinks.json
          else
            echo "::notice::저장소 변수 ANDROID_CERT_SHA256이 없어 assetlinks.json을 만들지 않습니다. Android에서 초대 링크는 브라우저로 열립니다."
          fi
          if [ -n "$APPLE_TEAM_ID" ]; then
            jq -n --arg app "$APPLE_TEAM_ID.$APP_ID" '{
              applinks: {
                details: [{
                  appIDs: [$app],
                  components: [{ "/": "/", "?": { room: "????" }, comment: "친구와 대결 초대 링크" }]
                }]
              }
            }' > build/web/.well-known/apple-app-site-association
            cat build/web/.well-known/apple-app-site-association
          else
            echo "::notice::저장소 변수 APPLE_TEAM_ID가 없어 apple-app-site-association을 만들지 않습니다. iOS에서 초대 링크는 브라우저로 열립니다."
          fi

      - name: Upload Pages artifact
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@v3
        with:
          path: build/web

  # Android 앱 번들(AAB). PR에서는 빌드되는지만 확인하고, main에서는 업로드 키로 서명해 아티팩트로 올린다.
  # 서명 시크릿(없으면 디버그 키로 서명하고, 그 AAB는 Play 스토어에 올릴 수 없음):
  # - ANDROID_KEYSTORE_BASE64: 업로드 키스토어(.jks) 파일을 base64로 인코딩한 값
  # - ANDROID_KEYSTORE_PASSWORD, ANDROID_KEY_ALIAS, ANDROID_KEY_PASSWORD
  android:
    name: Build Android app bundle
    runs-on: ubuntu-latest
    env:
      KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
      KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
      KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
      KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - run: flutter pub get

      - name: Set up upload key
        id: signing
        if: github.event_name != 'pull_request'
        run: |
          if [ -z "$KEYSTORE_BASE64" ] || [ -z "$KEYSTORE_PASSWORD" ] || [ -z "$KEY_ALIAS" ] || [ -z "$KEY_PASSWORD" ]; then
            echo "::notice::Android 서명 시크릿이 없어 디버그 키로 서명합니다. 이 AAB는 Play 스토어에 올릴 수 없습니다."
            echo "signed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/upload-keystore.jks"
          {
            echo "storeFile=$RUNNER_TEMP/upload-keystore.jks"
            echo "storePassword=$KEYSTORE_PASSWORD"
            echo "keyAlias=$KEY_ALIAS"
            echo "keyPassword=$KEY_PASSWORD"
          } > android/key.properties
          echo "signed=true" >> "$GITHUB_OUTPUT"

      # 버전 이름은 pubspec.yaml의 version, 버전 코드는 실행 번호(스토어에 올릴 때마다 커져야 함).
      - name: Build app bundle
        run: |
          flutter build appbundle --release \
            --dart-define-from-file=config/prod.json \
            --build-number=${{ github.run_number }}

      - name: Check signature
        if: steps.signing.outputs.signed == 'true'
        run: keytool -printcert -jarfile build/app/outputs/bundle/release/app-release.aab | grep -E 'Owner|SHA256:'

      - name: Upload app bundle
        if: steps.signing.outputs.signed == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: app-release-${{ github.run_number }}
          path: build/app/outputs/bundle/release/app-release.aab
          retention-days: 30

      - name: Remove upload key
        if: always()
        run: rm -f android/key.properties "$RUNNER_TEMP/upload-keystore.jks"

  deploy:
    name: Deploy to GitHub Pages
    if: ${{ !cancelled() && needs.build.result == 'success' && github.event_name != 'pull_request' && github.ref == 'refs/heads/main' }}
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
