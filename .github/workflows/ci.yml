name: CI & Deploy

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Analyze, test, build web
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - run: flutter --version
      - run: flutter pub get

      - name: Analyze
        run: |
          set +e
          dart analyze --format=machine --fatal-infos > analyze.txt 2>&1
          status=$?
          cat analyze.txt
          # 분석 결과를 PR 주석으로 남긴다.
          while IFS='|' read -r severity type code file line col length message; do
            [ -z "$message" ] && continue
            echo "::error file=${file#"$GITHUB_WORKSPACE"/},line=$line,col=$col::[$code] $message"
          done < analyze.txt
          exit $status

      - name: Test
        run: flutter test --reporter=github
      - run: flutter build web --release --base-href /

      - name: Upload Pages artifact
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@v3
        with:
          path: build/web

  deploy:
    name: Deploy to GitHub Pages
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
