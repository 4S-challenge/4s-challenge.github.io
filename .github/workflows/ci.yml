name: CI & Deploy

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  worker:
    name: Worker typecheck & test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: worker
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: worker/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm test

  build:
    name: Analyze, test, build web
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - run: flutter --version
      - run: flutter pub get

      - name: Analyze
        run: |
          set +e
          dart analyze --format=machine --fatal-infos > analyze.txt 2>&1
          status=$?
          cat analyze.txt
          # 분석 결과를 PR 주석으로 남긴다.
          while IFS='|' read -r severity type code file line col length message; do
            [ -z "$message" ] && continue
            echo "::error file=${file#"$GITHUB_WORKSPACE"/},line=$line,col=$col::[$code] $message"
          done < analyze.txt
          exit $status

      - name: Test
        run: flutter test --reporter=github

      # 저장소 변수 API_BASE_URL(랭킹 서버 주소)이 있으면 웹 빌드에 넣는다. 없으면 오프라인 모드.
      - name: Build web
        env:
          API_BASE_URL: ${{ vars.API_BASE_URL }}
        run: flutter build web --release --base-href / --dart-define=API_BASE_URL="$API_BASE_URL"

      - name: Upload Pages artifact
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@v3
        with:
          path: build/web

  deploy-worker:
    name: Deploy ranking server (Cloudflare)
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: worker
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: worker
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      D1_DATABASE_ID: ${{ vars.D1_DATABASE_ID }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: worker/package-lock.json

      - name: Check Cloudflare settings
        id: cf
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ] || [ -z "$D1_DATABASE_ID" ]; then
            echo "::notice::Cloudflare 설정(CLOUDFLARE_API_TOKEN, CLOUDFLARE_ACCOUNT_ID, D1_DATABASE_ID)이 없어 랭킹 서버 배포를 건너뜁니다."
            echo "ready=false" >> "$GITHUB_OUTPUT"
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi

      - if: steps.cf.outputs.ready == 'true'
        run: npm ci

      - name: Set D1 database id
        if: steps.cf.outputs.ready == 'true'
        run: sed -i "s/00000000-0000-0000-0000-000000000000/$D1_DATABASE_ID/" wrangler.toml

      - name: Apply D1 migrations
        if: steps.cf.outputs.ready == 'true'
        run: npx wrangler d1 migrations apply DB --remote

      - name: Deploy worker
        if: steps.cf.outputs.ready == 'true'
        run: npx wrangler deploy

  deploy:
    name: Deploy to GitHub Pages
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: [build, deploy-worker]
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
