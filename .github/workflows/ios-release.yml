name: iOS upload

# iOS 앱을 빌드·서명해서 App Store Connect(TestFlight)에 올린다 (수동 실행, Mac 필요 없음).
# 올라간 빌드는 TestFlight와 App Store 심사 제출에 함께 쓴다.
#
# 필요한 저장소 시크릿 (App Store Connect › 사용자 및 액세스 › 통합 › App Store Connect API › 팀 키, 권한: 관리자):
# - ASC_ISSUER_ID: Issuer ID
# - ASC_KEY_ID: 키 ID
# - ASC_PRIVATE_KEY: 내려받은 AuthKey_<키ID>.p8 파일 내용 전체
#
# 서명은 Xcode 자동 서명 + API 키로 처리한다. 배포 인증서와 프로필은 Apple이 관리(클라우드 서명)하므로
# 인증서 파일을 따로 만들거나 시크릿에 넣을 필요가 없다.
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ios-upload
  cancel-in-progress: false

jobs:
  upload:
    name: Build and upload to App Store Connect
    runs-on: macos-latest
    timeout-minutes: 60
    env:
      ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
      ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
      ASC_PRIVATE_KEY: ${{ secrets.ASC_PRIVATE_KEY }}
      TEAM_ID: G2422MW76B
    steps:
      - uses: actions/checkout@v5

      - name: Check secrets
        run: |
          missing=""
          [ -n "$ASC_ISSUER_ID" ] || missing="$missing ASC_ISSUER_ID"
          [ -n "$ASC_KEY_ID" ] || missing="$missing ASC_KEY_ID"
          [ -n "$ASC_PRIVATE_KEY" ] || missing="$missing ASC_PRIVATE_KEY"
          if [ -n "$missing" ]; then
            echo "::error::저장소 시크릿이 없습니다:$missing"
            exit 1
          fi
          case "$ASC_PRIVATE_KEY" in
            *"BEGIN PRIVATE KEY"*) ;;
            *) echo "::error::ASC_PRIVATE_KEY에 .p8 파일 내용 전체(-----BEGIN PRIVATE KEY----- 부터 -----END PRIVATE KEY----- 까지)를 넣어 주세요"; exit 1 ;;
          esac

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - run: flutter pub get

      - name: Write API key
        run: |
          mkdir -p "$RUNNER_TEMP/asc"
          printf '%s\n' "$ASC_PRIVATE_KEY" > "$RUNNER_TEMP/asc/AuthKey_$ASC_KEY_ID.p8"
          echo "ASC_KEY_PATH=$RUNNER_TEMP/asc/AuthKey_$ASC_KEY_ID.p8" >> "$GITHUB_ENV"

      # Flutter 설정(서버 주소, 광고 ID, 빌드 번호)과 CocoaPods만 준비하고, 실제 빌드·서명은 xcodebuild로 한다.
      # 빌드 번호는 이 워크플로의 실행 번호 (App Store Connect에 올릴 때마다 커져야 함).
      - name: Prepare Flutter iOS project
        run: |
          flutter build ios --config-only --release \
            --dart-define-from-file=config/prod.json \
            --build-number=${{ github.run_number }}

      - name: Archive (signed)
        run: |
          set +e
          xcodebuild archive \
            -workspace ios/Runner.xcworkspace \
            -scheme Runner \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath "$RUNNER_TEMP/Runner.xcarchive" \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$ASC_KEY_PATH" \
            -authenticationKeyID "$ASC_KEY_ID" \
            -authenticationKeyIssuerID "$ASC_ISSUER_ID" \
            DEVELOPMENT_TEAM="$TEAM_ID" \
            CODE_SIGN_STYLE=Automatic \
            > "$RUNNER_TEMP/archive.log" 2>&1
          status=$?
          tail -30 "$RUNNER_TEMP/archive.log"
          if [ "$status" -ne 0 ]; then
            grep -E "error:|Error|failed" "$RUNNER_TEMP/archive.log" | sort -u | head -20 | while read -r line; do
              echo "::error title=archive::${line:0:900}"
            done
            exit "$status"
          fi

      - name: Upload to App Store Connect
        run: |
          cat > "$RUNNER_TEMP/ExportOptions.plist" <<EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key><string>app-store-connect</string>
            <key>destination</key><string>upload</string>
            <key>teamID</key><string>$TEAM_ID</string>
            <key>signingStyle</key><string>automatic</string>
            <key>manageAppVersionAndBuildNumber</key><false/>
            <key>uploadSymbols</key><true/>
          </dict>
          </plist>
          EOF
          set +e
          xcodebuild -exportArchive \
            -archivePath "$RUNNER_TEMP/Runner.xcarchive" \
            -exportOptionsPlist "$RUNNER_TEMP/ExportOptions.plist" \
            -exportPath "$RUNNER_TEMP/export" \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$ASC_KEY_PATH" \
            -authenticationKeyID "$ASC_KEY_ID" \
            -authenticationKeyIssuerID "$ASC_ISSUER_ID" \
            > "$RUNNER_TEMP/export.log" 2>&1
          status=$?
          tail -40 "$RUNNER_TEMP/export.log"
          if [ "$status" -ne 0 ]; then
            grep -iE "error|failed" "$RUNNER_TEMP/export.log" | sort -u | head -20 | while read -r line; do
              echo "::error title=upload::${line:0:900}"
            done
            exit "$status"
          fi
          version=$(grep '^version:' pubspec.yaml | sed 's/version: *//; s/+.*//')
          echo "::notice::App Store Connect에 올렸습니다: 버전 $version (빌드 ${{ github.run_number }}). 10~20분 처리 후 TestFlight·심사 제출에서 고를 수 있습니다."

      - name: Remove API key
        if: always()
        run: rm -rf "$RUNNER_TEMP/asc"
