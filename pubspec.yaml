name: four_s_challenge
description: "4S 챌린지 - 숫자야구. 숨겨진 네 자리 숫자를 추리하는 게임."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.5.0

dependencies:
  app_links: ^7.2.2
  flutter:
    sdk: flutter
  google_fonts: ^6.2.1
  google_mobile_ads: '>=5.3.0 <9.0.0'
  app_tracking_transparency: '>=2.0.6 <3.0.0'
  http: ^1.2.2
  share_plus: '>=11.0.0 <14.0.0'
  url_launcher: ^6.3.3
  web: ^1.1.0
  web_socket_channel: ^3.0.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  flutter_launcher_icons: ^0.14.4

flutter:
  uses-material-design: true

# 앱 아이콘: dart run tool/make_icon.dart 로 SVG를 만들고 PNG로 바꾼 뒤
# dart run flutter_launcher_icons 로 Android·iOS·웹에 적용한다 (README 참고).
flutter_launcher_icons:
  image_path: assets/icon/icon.png
  android: true
  adaptive_icon_background: "#08201A"
  adaptive_icon_foreground: assets/icon/icon_foreground.png
  adaptive_icon_foreground_inset: 0 # 앞면 이미지가 이미 안전 영역에 맞춰져 있음
  adaptive_icon_monochrome: assets/icon/icon_monochrome.png
  ios: true
  remove_alpha_ios: true
  background_color_ios: "#0E2A22"
  web:
    generate: true
    background_color: "#0E2A22"
    theme_color: "#0E2A22"
